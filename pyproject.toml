[project]
name = "intervuai"
version = "1.0.0"
description = "IntervuAI - AI-Powered Interview Preparation Platform"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.6",
    "python-docx>=0.8.11",
    "pdfminer.six>=20221105",
    "google-generativeai>=0.1.0",
    "httpx>=0.24.1",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "main:app"
