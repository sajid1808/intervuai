        // Main App State & Routing Controller Component
        function App() {
            const [tab, setTab] = useState("landing");
            const [authUser, setAuthUser] = useState(null);
            const [activeRole, setActiveRole] = useState(null);
            
            // Toast states
            const [toast, setToast] = useState(null);

            const showToast = (message, type = "success") => {
                setToast({ message, type });
            };

            const onLogout = () => {
                localStorage.removeItem("token");
                delete api.defaults.headers.common["Authorization"];
                setAuthUser(null);
                setTab("landing");
                showToast("Logged out successfully");
            };

            const startInterviewDirect = (role) => {
                setActiveRole(role);
                setTab("interview-screen");
            };

            // Attempt session sync on load
            useEffect(() => {
                const checkUserSession = async () => {
                    const token = localStorage.getItem("token");
                    if (token) {
                        try {
                            const response = await api.get("/auth/me");
                            setAuthUser(response.data);
                            setTab("dashboard");
                        } catch (err) {
                            // token expired or invalid
                            localStorage.removeItem("token");
                            setTab("landing");
                        }
                    }
                };
                checkUserSession();
            }, []);

            // Sidebar and App structure routing matching hashes
            const renderContent = () => {
                if (tab === "landing") return <LandingPage setTab={setTab} />;
                if (tab === "login") return <LoginPage setTab={setTab} setAuthUser={setAuthUser} showToast={showToast}/>;
                if (tab === "register") return <RegisterPage setTab={setTab} showToast={showToast}/>;
                
                // Protected route content wrapper
                return (
                    <div className="app-container">
                        <Sidebar currentTab={tab.split("-")[0]} setTab={setTab} onLogout={onLogout} user={authUser} />
                        <div className="main-content">
                            {tab === "dashboard" && <DashboardPage setTab={setTab} showToast={showToast} startInterviewDirect={startInterviewDirect}/>}
                            {tab === "ats" && <AtsPage showToast={showToast}/>}
                            {tab === "roles" && <JobRoleExplorerPage setTab={setTab} showToast={showToast} startInterviewDirect={startInterviewDirect}/>}
                            {tab === "interview-screen" && <InterviewScreenPage showToast={showToast} activeRole={activeRole} returnToExplorer={() => setTab("roles")} setTab={setTab}/>}
                            {tab.startsWith("results-") && <InterviewResultsPage interviewId={tab.split("-")[1]} showToast={showToast} setTab={setTab}/>}
                            {tab === "practice" && <PracticePage showToast={showToast} setTab={setTab}/>}
                            {tab === "profile" && <ProfilePage showToast={showToast}/>}
                            {tab === "history" && <InterviewHistoryPage setTab={setTab} showToast={showToast}/>}
                            {tab === "admin" && <AdminDashboardPage showToast={showToast}/>}
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {renderContent()}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
