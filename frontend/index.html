<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntervuAI - AI-Powered Career Prep & Interview System</title>
    
    <!-- Google Fonts (Plus Jakarta Sans & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React and ReactDOM CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel CDN for transpiling JSX in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.5/babel.min.js" crossorigin></script>
    
    <!-- Axios for HTTP Requests -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    
    <!-- Chart.js CDN for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS Styling (Obsidian & Electric Violet Luxury Theme) -->
    <style>
        :root {
            --bg-base: #06060A;
            --bg-surface: #0C0C12;
            --bg-card: #101017;
            --bg-card-hover: #161622;
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --primary-light: #C4B5FD;
            --primary-glow: rgba(139, 92, 246, 0.45);
            --primary-gradient: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
            --accent: #10B981;
            --accent-purple: #A855F7;
            --accent-danger: #EF4444;
            --accent-warning: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(139, 92, 246, 0.5);
            --glass-bg: rgba(14, 14, 20, 0.82);
            --glass-blur: blur(20px);
            --shadow-premium: 0 20px 50px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(124, 58, 237, 0.1);
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-pill: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 90% 55% at 50% -12%, rgba(124, 58, 237, 0.32) 0%, rgba(76, 29, 149, 0.12) 40%, transparent 75%),
                radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 15% 75%, rgba(99, 102, 241, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Sleek modern scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        h1, h2, h3, h4, h5 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #FFFFFF;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, input, select, textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        /* Layout & Utilities */
        .app-container {
            display: flex;
            min-height: 100vh;
            background: transparent;
        }

        .main-content {
            flex: 1;
            padding: 2.25rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: var(--shadow-premium);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .glass-panel:hover {
            border-color: rgba(139, 92, 246, 0.25);
        }

        /* Luxury Pill Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.75rem 1.6rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: var(--font-display);
            letter-spacing: -0.01em;
            font-size: 0.92rem;
            user-select: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.6);
            background: linear-gradient(135deg, #9333EA 0%, #7C3AED 100%);
        }

        .btn-hero-white {
            background: #FFFFFF;
            color: #08080C;
            font-weight: 700;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.25);
        }
        .btn-hero-white:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(255, 255, 255, 0.4);
            background: #F8FAFC;
        }

        .btn-hero-dark {
            background: rgba(255, 255, 255, 0.06);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(10px);
        }
        .btn-hero-dark:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            backdrop-filter: blur(8px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(139, 92, 246, 0.35);
            transform: translateY(-2px);
            color: #FFFFFF;
        }

        .btn-accent {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }
        .btn-accent:hover {
            background-color: #0D9488;
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.5);
        }

        .btn-danger {
            background-color: var(--accent-danger);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
        }
        .btn-danger:hover {
            background-color: #DC2626;
            transform: translateY(-2px);
        }

        /* Inputs */
        .input-group {
            margin-bottom: 1.25rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.88rem;
            letter-spacing: -0.01em;
        }
        .form-input {
            width: 100%;
            background-color: #0B0B10;
            color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem 1.15rem;
            outline: none;
            transition: all 0.25s ease;
            font-size: 0.95rem;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
            background-color: #0F0F16;
        }
        select.form-input {
            background-color: #0B0B10;
            color: #FFFFFF;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.1rem center;
            background-size: 1.1rem;
            padding-right: 2.75rem;
        }
        select.form-input option {
            background-color: #0E0E14;
            color: #FFFFFF;
            padding: 0.75rem 1rem;
        }

        /* Modern Choice Field Chips & Cards */
        .choice-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 0.4rem;
        }
        .choice-chip {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
        }
        .choice-chip:hover {
            background: rgba(139, 92, 246, 0.12);
            color: #FFFFFF;
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }
        .choice-chip.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(99, 102, 241, 0.18) 100%);
            color: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.4);
            font-weight: 600;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.85rem;
            margin-top: 0.4rem;
        }
        .choice-card {
            padding: 1rem 1.2rem;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            user-select: none;
        }
        .choice-card:hover {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.08);
            transform: translateY(-2px);
        }
        .choice-card.active {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.18);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .choice-card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .choice-card-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Voice Input Pulse Banner */
        .mic-active-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: var(--radius-pill);
            color: #FCA5A5;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 0.85rem;
            backdrop-filter: blur(10px);
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #EF4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-ring 1.2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 290px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.75rem 1.25rem;
            backdrop-filter: blur(16px);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            margin-bottom: 2rem;
            cursor: pointer;
        }
        .sidebar-brand .brand-icon {
            font-size: 1.5rem;
            color: var(--primary);
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.6));
        }
        .sidebar-brand span {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFFFFF 40%, #C4B5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand .brand-plus {
            color: var(--accent-purple);
            -webkit-text-fill-color: var(--accent-purple);
            font-size: 1.15rem;
            margin-left: 2px;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .sidebar-item a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.15rem;
            border-radius: var(--radius-pill);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.92rem;
            transition: all 0.25s ease;
        }
        .sidebar-item a:hover {
            color: #FFFFFF;
            background-color: rgba(139, 92, 246, 0.12);
        }
        .sidebar-item.active a {
            color: #FFFFFF;
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.25) 0%, rgba(99, 102, 241, 0.12) 100%);
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.15);
            font-weight: 600;
        }
        .sidebar-user {
            margin-top: auto;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.85rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
        }
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: var(--font-display);
            color: white;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }

        /* Dashboard specific grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-radius: var(--radius-lg);
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .stat-header i {
            color: var(--primary);
            font-size: 1.15rem;
        }
        .stat-value {
            font-size: 2.25rem;
            font-weight: 800;
            font-family: var(--font-display);
            background: linear-gradient(135deg, white, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-footer {
            font-size: 0.82rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .stat-footer.negative {
            color: var(--accent-danger);
        }

        /* General dashboard panels layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.75rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ATS score circular progress */
        .ats-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto;
        }
        .ats-circle-svg {
            transform: rotate(-90deg);
        }
        .ats-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 12;
        }
        .ats-circle-progress {
            fill: none;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
            transition: stroke-dashoffset 1s ease-in-out;
        }
        .ats-circle-text {
            position: absolute;
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 800;
            color: white;
        }

        /* List components */
        .list-items {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all 0.25s ease;
        }
        .list-item:hover {
            background-color: rgba(139, 92, 246, 0.06);
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateX(4px);
        }

        /* Badges */
        .badge {
            padding: 0.3rem 0.85rem;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-success { background-color: rgba(16, 185, 129, 0.15); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-warning { background-color: rgba(245, 158, 11, 0.15); color: var(--accent-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-danger { background-color: rgba(239, 68, 68, 0.15); color: var(--accent-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-primary { background-color: rgba(139, 92, 246, 0.18); color: var(--primary-light); border: 1px solid rgba(139, 92, 246, 0.35); }

        /* General page grids */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-title {
            font-size: 1.85rem;
            margin-bottom: 0.3rem;
            letter-spacing: -0.025em;
        }
        .header-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Loading Spinner */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 1.25rem;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6));
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Landing Page Layout (Image 1, 2, 3, 4 Aesthetic) */
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .landing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 6%;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 6, 10, 0.7);
        }
        .landing-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .landing-logo .sparkle-icon {
            color: var(--primary);
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.8));
        }
        .landing-nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .landing-nav-links a {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .landing-nav-links a:hover {
            color: #FFFFFF;
        }

        .landing-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5rem 6% 3rem;
            max-width: 950px;
            margin: 0 auto;
            position: relative;
        }
        .landing-hero-badge {
            background: rgba(139, 92, 246, 0.12);
            color: #C4B5FD;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.45rem 1.25rem;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.2);
        }
        .landing-title {
            font-size: 4.25rem;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.035em;
            margin-bottom: 1.5rem;
            color: #FFFFFF;
        }
        .landing-title-highlight {
            background: linear-gradient(135deg, #FFFFFF 30%, #C4B5FD 70%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .landing-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 720px;
            line-height: 1.6;
            margin-bottom: 2.25rem;
        }
        .landing-cta {
            display: flex;

        // ATS Resume Analysis Screen Component
        function AtsPage({ showToast }) {
            const [resumeFile, setResumeFile] = useState(null);
            const [jobText, setJobText] = useState("");
            const [loading, setLoading] = useState(false);
            const [analysis, setAnalysis] = useState(null);
            
            // Confirm/Edit state
            const [confirming, setConfirming] = useState(false);
            const [resumeInfo, setResumeInfo] = useState(null);
            const [resumeId, setResumeId] = useState(null);

            const handleFileChange = (e) => {
                setResumeFile(e.target.files[0]);
            };

            const handleUpload = async (e) => {
                e.preventDefault();
                if (!resumeFile) {
                    showToast("Please select a file to upload", "error");
                    return;
                }
                
                setLoading(true);
                const formData = new FormData();
                formData.append("file", resumeFile);
                
                try {
                    const response = await api.post("/resumes/upload", formData, {
                        headers: { "Content-Type": "multipart/form-data" }
                    });
                    setResumeId(response.data.id);
                    setResumeInfo(response.data.extracted_info);
                    setConfirming(true);
                    showToast("Resume parsed successfully! Please confirm details.", "success");
                } catch (err) {
                    showToast(err.response?.data?.detail || "Upload or parsing failure", "error");
                } finally {
                    setLoading(false);

            };

            const handleConfirm = async () => {
                setLoading(true);
                try {
                    await api.put(`/resumes/${resumeId}/confirm`, resumeInfo);
                    setConfirming(false);
                    showToast("Resume profiles synchronized!", "success");
                    
                    // Trigger ATS Check (general or job-specific)
                    const atsResponse = await api.post("/resumes/analyze", {
                        resume_id: resumeId,
                        raw_job_description: jobText || null
                    });
                    setAnalysis(atsResponse.data);

                    showToast("Failed to run ATS comparison", "error");

                                <label><i className="fa-solid fa-filter" style={{ marginRight: '0.35rem', color: 'var(--primary)' }}></i> Filter Category</label>

                                </div>
                                <button type="submit" className="btn btn-primary" style={{ padding: '0.75rem 1rem' }}>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>

                        </div>

                        {/* Quick Category Pills */}
                        <div style={{ marginTop: '1rem', paddingTop: '1rem', borderTop: '1px solid var(--border-color)' }}>

                            <div className="choice-chips">
                                <span 
                                    className={`choice-chip ${category === "" ? 'active' : ''}`}
                                    style={{ fontSize: '0.8rem', padding: '0.35rem 0.75rem' }}
                                    onClick={() => setCategory("")}
                                >
                                    All Categories
                                </span>
                                {categories.map(c => (
                                    <span 
                                        key={c}
                                        className={`choice-chip ${category === c ? 'active' : ''}`}
                                        style={{ fontSize: '0.8rem', padding: '0.35rem 0.75rem' }}

                                    >
                                        {c}
                                    </span>

                        </div>
                    </div>

                    {loading ? (
                        <div className="spinner-container">
                            <div className="spinner"></div>
                            <p style={{ color: 'var(--text-muted)' }}>Retrieving roles taxonomy...</p>
                        </div>
                    ) : (
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '1.5rem' }}>
                            {roles.map(r => (
                                <div className="glass-panel stat-card" key={r.id} style={{ display: 'flex', flexDirection: 'column', gap: '1rem', justifyContent: 'space-between' }}>
                                    <div>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.5rem' }}>
                                            <h3 style={{ fontSize: '1.15rem' }}>{r.title}</h3>
                                            <span className="badge badge-primary" style={{ fontSize: '0.65rem' }}>{r.category}</span>
                                        </div>
                                        <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>{r.description}</p>
                                    </div>
                                    <button className="btn btn-primary" style={{ width: '100%' }} onClick={() => startInterviewDirect(r)}>
                                        Configure Mock Interview
                                    </button>
                                </div>
                            ))}
                            {roles.length === 0 && (
                                <div className="empty-state" style={{ gridColumn: '1 / -1' }}>
                                    <i className="fa-solid fa-circle-question"></i>
                                    <p>No matches found in taxonomy database. Type your custom role on the input above!</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Interview Configuration & active Mock Screen Component
        function InterviewScreenPage({ showToast, activeRole, returnToExplorer, setTab }) {
            const [step, setStep] = useState("config"); // config, loading, active, review
            const [config, setConfig] = useState({
                experience_level: "Intermediate",
                difficulty: "Medium",
                type: "Technical",
                num_questions: 5
            });

            const [interviewId, setInterviewId] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [answerText, setAnswerText] = useState("");
            const [submittingAnswer, setSubmittingAnswer] = useState(false);
            const [timeLeft, setTimeLeft] = useState(120); // 2 mins per answer draft timer

            // Speech recognition state variables
            const [isRecording, setIsRecording] = useState(false);
            const recognitionRef = useRef(null);
            const isRecordingRef = useRef(false);
            const baseAnswerRef = useRef("");

            // Clean up recognition on unmount or question advance
            useEffect(() => {
                return () => {
                    isRecordingRef.current = false;
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch(e) {}
                    }
                };
            }, []);

            // Fetch timer
            useEffect(() => {
                let interval = null;
                if (step === "active" && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && step === "active") {
                    handleSubmitAnswer();
                }
                return () => clearInterval(interval);
            }, [timeLeft, step]);

            const initRecognition = () => {
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    return null;
                }
                const SpeechObj = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechObj();
                rec.continuous = true;
                rec.interimResults = true;
                rec.lang = 'en-US';

                rec.onresult = (e) => {
                    let interimTranscript = '';
                    let finalChunk = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        const transcript = e.results[i][0].transcript;
                        if (e.results[i].isFinal) {
                            finalChunk += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (finalChunk) {
                        baseAnswerRef.current = (baseAnswerRef.current + ' ' + finalChunk).trim();
                    }
                    const fullText = (baseAnswerRef.current + (interimTranscript ? ' ' + interimTranscript : '')).trim();
                    setAnswerText(fullText);
                };

                rec.onerror = (e) => {
                    console.warn("Speech recognition event:", e.error);
                    if (e.error === 'no-speech') {
                        // User momentarily paused speaking; keep active
                        return;
                    }
                    if (e.error === 'not-allowed') {
                        showToast("Microphone permission denied. Please allow microphone access in your browser.", "error");
                        isRecordingRef.current = false;
                        setIsRecording(false);
                        return;
                    }
                };

                rec.onend = () => {
                    if (isRecordingRef.current) {
                        try {
                            rec.start();
                        } catch (err) {
                            isRecordingRef.current = false;
                            setIsRecording(false);
                        }
                    } else {
                        setIsRecording(false);
                    }
                };

                return rec;
            };

            const toggleSpeech = async () => {
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    showToast("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.", "error");
                    return;
                }

                if (isRecording) {
                    isRecordingRef.current = false;
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch(e) {}
                    }
                    setIsRecording(false);
                    showToast("Voice recording paused.", "success");
                    return;
                }

                // Explicitly request mic permission first so the browser grants audio stream
                try {
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(t => t.stop());
                    }
                } catch (err) {
                    showToast("Microphone permission was denied. Please allow microphone access in your browser address bar.", "error");
                    return;
                }

                baseAnswerRef.current = answerText;
                if (!recognitionRef.current) {
                    recognitionRef.current = initRecognition();
                }

                if (!recognitionRef.current) {
                    showToast("Speech recognition failed to initialize.", "error");
                    return;
                }

                try {
                    isRecordingRef.current = true;
                    recognitionRef.current.start();
                    setIsRecording(true);
                    showToast("Microphone active! Speak now — words will appear live.", "success");
                } catch (err) {
                    try {
                        recognitionRef.current = initRecognition();
                        isRecordingRef.current = true;
                        recognitionRef.current.start();
                        setIsRecording(true);
                        showToast("Microphone active! Speak now.", "success");
                    } catch (e2) {
                        showToast("Could not activate microphone: " + e2.message, "error");
                        isRecordingRef.current = false;
                        setIsRecording(false);
                    }
                }
            };

            const handleInitInterview = async () => {
                setStep("loading");
                try {
                    const response = await api.post("/interviews/configure", {
                        job_role_id: activeRole.id,
                        experience_level: config.experience_level,
                        difficulty: config.difficulty,
                        type: config.type,
                        num_questions: config.num_questions
                    });
                    
                    setInterviewId(response.data.interview_id);
                    setCurrentQuestion(response.data.first_question);
                    setStep("active");
                    setTimeLeft(180); // reset 3 minutes timer
                    setAnswerText("");
                } catch (err) {
                    showToast("Failed to initialize dynamic interview setup", "error");
                    setStep("config");
                }
            };

            const handleSubmitAnswer = async () => {
                if (!answerText.trim()) {
                    showToast("Please provide an answer response before submitting.", "error");
                    return;
                }
                
                // Stop speech if running
                if (isRecording && recognitionRef.current) {
                    recognitionRef.current.stop();
                    setIsRecording(false);
                }

                setSubmittingAnswer(true);
                try {
                    const response = await api.post(`/interviews/${interviewId}/answers`, {
                        question_id: currentQuestion.id,
                        answer_text: answerText,
                        response_time_seconds: 180 - timeLeft
                    });

                    if (response.data.is_completed) {
                        showToast("Interview complete! Grading responses...", "success");
                        // Direct to Results
                        setStep("loading");
                        setTimeout(() => {
                            setTab("results-" + interviewId);
                        }, 1000);
                    } else {
                        setCurrentQuestion(response.data.next_question);
                        setAnswerText("");
                        setTimeLeft(180);
                        showToast("Answer recorded! Moving to next prompt.", "success");
                    }
                } catch (err) {
                    showToast("Submission failed", "error");
                } finally {
                    setSubmittingAnswer(false);
                }
            };

            if (step === "loading") {
                return (
                    <div className="spinner-container">
                        <div className="spinner"></div>
                        <p style={{ color: 'var(--text-muted)' }}>AI engine evaluating criteria & generating personalized questions...</p>
                    </div>
                );
            }

            if (step === "config") {
                const experienceOptions = [
                    { id: "Fresher", label: "Fresher", desc: "Graduate / 0 yrs" },
                    { id: "Entry Level", label: "Entry Level", desc: "0 - 1 years" },
                    { id: "Intermediate", label: "Intermediate", desc: "2 - 4 years" },
                    { id: "Experienced", label: "Experienced", desc: "5 - 7 years" },
                    { id: "Senior", label: "Senior", desc: "Team Lead / 8+ yrs" },
                    { id: "Lead/Manager", label: "Lead / Manager", desc: "Engineering Management" }
                ];

                const difficultyOptions = [
                    { id: "Easy", label: "Easy", color: "#10B981", icon: "fa-seedling" },
                    { id: "Medium", label: "Medium", color: "#F59E0B", icon: "fa-bolt" },
                    { id: "Hard", label: "Hard", color: "#F97316", icon: "fa-fire" },
                    { id: "Expert", label: "Expert", color: "#EF4444", icon: "fa-skull" }
                ];

                const typeOptions = [
                    { id: "Technical", label: "Technical", icon: "fa-code", desc: "Architecture, coding & core concepts" },
                    { id: "Behavioral", label: "Behavioral", icon: "fa-users", desc: "STAR method scenarios & collaboration" },
                    { id: "HR", label: "HR / Fit", icon: "fa-handshake", desc: "Culture fit, motivation & background" },
                    { id: "Resume-Based", label: "Resume-Based", icon: "fa-file-invoice", desc: "Deep-dive questions on your real projects" },
                    { id: "Mixed", label: "Mixed", icon: "fa-layer-group", desc: "Balanced blend of Technical + Behavioral" }
                ];

                const countOptions = [5, 10, 15, 20];

                return (
                    <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                        <div className="flex-between">
                            <div>
                                <h2 className="header-title"><i className="fa-solid fa-gears text-success"></i> Configure Mock Interview</h2>
                                <p className="header-subtitle">Targeting Role: <strong>{activeRole.title}</strong></p>
                            </div>
                            <button className="btn btn-secondary" onClick={returnToExplorer}>
                                <i className="fa-solid fa-arrow-left"></i> Change Role
                            </button>
                        </div>
                        
                        <div className="glass-panel" style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label><i className="fa-solid fa-user-graduate" style={{ marginRight: '0.4rem', color: 'var(--primary)' }}></i> Experience Level</label>
                                <div className="choice-grid">
                                    {experienceOptions.map(opt => (
                                        <div 
                                            key={opt.id}
                                            className={`choice-card ${config.experience_level === opt.id ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, experience_level: opt.id})}
                                        >
                                            <div className="choice-card-title">
                                                <span>{opt.label}</span>
                                                {config.experience_level === opt.id && <i className="fa-solid fa-circle-check text-success"></i>}
                                            </div>
                                            <div className="choice-card-desc">{opt.desc}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label><i className="fa-solid fa-gauge-high" style={{ marginRight: '0.4rem', color: 'var(--primary)' }}></i> Question Difficulty</label>
                                <div className="choice-chips">
                                    {difficultyOptions.map(opt => (
                                        <div
                                            key={opt.id}
                                            className={`choice-chip ${config.difficulty === opt.id ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, difficulty: opt.id})}
                                            style={config.difficulty === opt.id ? { borderColor: opt.color, boxShadow: `0 0 12px ${opt.color}40` } : {}}
                                        >
                                            <i className={`fa-solid ${opt.icon}`} style={{ color: opt.color }}></i>
                                            <span>{opt.label}</span>
                                            {config.difficulty === opt.id && <i className="fa-solid fa-check" style={{ fontSize: '0.75rem', marginLeft: '0.25rem' }}></i>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label><i className="fa-solid fa-briefcase" style={{ marginRight: '0.4rem', color: 'var(--primary)' }}></i> Interview Type</label>
                                <div className="choice-grid">
                                    {typeOptions.map(opt => (
                                        <div 
                                            key={opt.id}
                                            className={`choice-card ${config.type === opt.id ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, type: opt.id})}
                                        >
                                            <div className="choice-card-title">
                                                <span><i className={`fa-solid ${opt.icon}`} style={{ marginRight: '0.5rem', color: 'var(--primary)' }}></i>{opt.label}</span>
                                                {config.type === opt.id && <i className="fa-solid fa-circle-check text-success"></i>}
                                            </div>
                                            <div className="choice-card-desc">{opt.desc}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label><i className="fa-solid fa-list-ol" style={{ marginRight: '0.4rem', color: 'var(--primary)' }}></i> Number of Questions</label>
                                <div className="choice-chips">
                                    {countOptions.map(cnt => (
                                        <div
                                            key={cnt}
                                            className={`choice-chip ${config.num_questions === cnt ? 'active' : ''}`}
                                            onClick={() => setConfig({...config, num_questions: cnt})}
                                        >
                                            <i className="fa-solid fa-clipboard-question"></i>
                                            <span>{cnt} Questions</span>
                                            {config.num_questions === cnt && <i className="fa-solid fa-check" style={{ fontSize: '0.75rem', marginLeft: '0.25rem' }}></i>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <button className="btn btn-primary" style={{ width: '100%', padding: '1rem', marginTop: '0.5rem', fontSize: '1.05rem' }} onClick={handleInitInterview}>
                                <i className="fa-solid fa-wand-magic-sparkles"></i> Generate AI Questions & Begin Session
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="interview-grid">
                    <div style={{ display: 'flex', flexDirection: 'column' }}>
                        <div className="flex-between">
                            <div>
                                <h2 className="header-title">{activeRole.title} Mock Session</h2>
                                <p className="header-subtitle">Question index: <strong>{currentQuestion.order_index}</strong></p>
                            </div>
                            <div className="timer-badge">
                                <i className="fa-solid fa-hourglass-half"></i>
                                <span>{Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}</span>
                            </div>
                        </div>
                        
                        <div className="question-box">
                            <i className="fa-solid fa-quote-left" style={{ position: 'absolute', top: '10px', left: '10px', opacity: 0.1, fontSize: '2rem' }}></i>
                            <p style={{ paddingLeft: '1rem' }}>{currentQuestion.question_text}</p>
                        </div>

                        {isRecording && (
                            <div className="mic-active-banner">
                                <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.6rem' }}>
                                    <span className="pulse-dot"></span>
                                    <span>Microphone Active (Listening...) Speak clearly into your mic.</span>
                                </span>
                                <button className="btn btn-secondary" style={{ padding: '0.25rem 0.75rem', fontSize: '0.8rem' }} onClick={toggleSpeech}>
                                    Stop Mic
                                </button>
                            </div>
                        )}
                        
                        <textarea 
                            className="answer-textarea" 
                            value={answerText} 
                            onChange={e => { 
                                setAnswerText(e.target.value); 
                                baseAnswerRef.current = e.target.value; 
                            }} 
                            placeholder="Type your comprehensive response here, or click Dictate Response below to speak into your microphone..."
                        ></textarea>
                        
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                            <button className={`btn ${isRecording ? 'btn-danger' : 'btn-secondary'}`} onClick={toggleSpeech}>
                                <i className={`fa-solid ${isRecording ? 'fa-microphone-slash' : 'fa-microphone'}`}></i>
                                {isRecording ? "Stop Voice Input" : "Dictate Response (Voice Input)"}
                            </button>
                            <button className="btn btn-primary" disabled={submittingAnswer} onClick={handleSubmitAnswer}>
                                {submittingAnswer ? "Evaluating..." : "Submit Answer"}
                                <i className="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div className="glass-panel" style={{ height: 'fit-content' }}>
                        <h3 style={{ marginBottom: '1rem' }}><i className="fa-solid fa-clipboard-check"></i> Checklist Guide</h3>
                        <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginBottom: '1rem' }}>
                            Aim to hit these expected concepts for optimal evaluation grading:
                        </p>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                            <span className="badge badge-primary">Technical correctness</span>
                            <span className="badge badge-primary">Structured reasons</span>
                            <span className="badge badge-primary">Problem solving</span>
                            <span className="badge badge-primary">Active impact</span>
                        </div>
                    </div>
                </div>
            );
        }

        // Interview Report / Results Component
        function InterviewResultsPage({ interviewId, showToast, setTab }) {
            const [results, setResults] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchResults = async () => {
                    try {
                        const response = await api.get(`/interviews/${interviewId}/results`);
                        setResults(response.data);
                    } catch (err) {
                        showToast("Could not retrieve interview evaluation report", "error");
                    } finally {
                        setLoading(false);
                    }
                };
                fetchResults();
            }, [interviewId]);

            if (loading) {
                return (
                    <div className="spinner-container">
                        <div className="spinner"></div>
                        <p style={{ color: 'var(--text-muted)' }}>Assembling evaluation feedback & preparing recommendations...</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="flex-between">
                        <div>
                            <h2 className="header-title"><i className="fa-solid fa-circle-check text-success"></i> Interview Performance Report</h2>
                            <p className="header-subtitle">{results.job_role_title} • {results.type} • {results.difficulty}</p>
                        </div>
                        <button className="btn btn-primary" onClick={() => setTab("dashboard")}><i className="fa-solid fa-table-columns"></i> Return to Dashboard</button>
                    </div>
                    
                    <div className="stats-grid">
                        <div className="glass-panel stat-card" style={{ textAlign: 'center', justifyContent: 'center' }}>
                            <div className="stat-header">
                                <span>OVERALL GRADE</span>
                                <i className="fa-solid fa-award"></i>
                            </div>
                            <div className="stat-value" style={{ fontSize: '3rem', color: 'var(--accent)' }}>{results.overall_score}%</div>
                            <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.5rem' }}>Averaged score of mock questions</p>
                        </div>
                        
                        <div className="glass-panel stat-card" style={{ gridColumn: 'span 2' }}>
                            <h3 style={{ marginBottom: '1rem' }}><i className="fa-solid fa-chart-line"></i> Recommendations & Study Plan</h3>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                <p style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>{results.feedback}</p>
                                <strong style={{ marginTop: '0.5rem' }}>Recommended Review Roadmap:</strong>
                                <ul style={{ fontSize: '0.85rem', color: 'var(--text-muted)', paddingLeft: '1.25rem' }}>
                                    {results.recommendations?.topics_to_revise?.map((item, idx) => (
                                        <li key={idx} style={{ marginBottom: '0.25rem' }}>
                                            <strong style={{ color: 'var(--accent-warning)' }}>{item.topic} ({item.priority}):</strong> {item.reason}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <h3 style={{ marginBottom: '1rem' }}><i className="fa-solid fa-list-check"></i> Answer Review Details</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                        {results.questions_review.map((item, idx) => (
                            <div className="glass-panel" key={item.id} style={{ borderLeft: '4px solid var(--primary)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                    <strong style={{ fontSize: '1.1rem' }}>Question {idx + 1}: {item.question_text}</strong>
                                    <span className="badge badge-success" style={{ fontSize: '0.8rem' }}>Score: {item.evaluation?.score}%</span>
                                </div>
                                
                                <div style={{ marginBottom: '1rem' }}>
                                    <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '0.25rem' }}>Your Response:</span>
                                    <p style={{ padding: '0.75rem', backgroundColor: 'rgba(255,255,255,0.01)', border: '1px solid var(--border-color)', borderRadius: '6px', fontSize: '0.95rem' }}>
                                        {item.user_answer}
                                    </p>
                                </div>

                                {(() => {

        // Focused Practice Mode Screen Component
        function PracticePage({ showToast, setTab }) {
            const [step, setStep] = useState("setup"); // setup, active, summary
            const [topic, setTopic] = useState("SQL Indexing & Query Tuning");
            const [difficulty, setDifficulty] = useState("Medium");
            const [numQuestions, setNumQuestions] = useState(3);
            const [practiceId, setPracticeId] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answersData, setAnswersData] = useState({}); // { [index]: { answerText, evaluation } }
            const [currentAnswer, setCurrentAnswer] = useState("");
            const [loading, setLoading] = useState(false);
            const [evaluating, setEvaluating] = useState(false);

            // Speech recognition state for Practice Mode
            const [isRecording, setIsRecording] = useState(false);
            const recognitionRef = useRef(null);
            const isRecordingRef = useRef(false);
            const baseAnswerRef = useRef("");

            useEffect(() => {
                return () => {
                    isRecordingRef.current = false;
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch(e) {}
                    }
                };
            }, []);

            const initRecognition = () => {
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    return null;
                }
                const SpeechObj = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechObj();
                rec.continuous = true;
                rec.interimResults = true;
                rec.lang = 'en-US';

                rec.onresult = (e) => {
                    let interimTranscript = '';
                    let finalChunk = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        const transcript = e.results[i][0].transcript;
                        if (e.results[i].isFinal) {
                            finalChunk += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (finalChunk) {
                        baseAnswerRef.current = (baseAnswerRef.current + ' ' + finalChunk).trim();
                    }
                    const fullText = (baseAnswerRef.current + (interimTranscript ? ' ' + interimTranscript : '')).trim();
                    setCurrentAnswer(fullText);
                };

                rec.onerror = (e) => {
                    console.warn("Practice speech error:", e.error);
                    if (e.error === 'no-speech') return;
                    if (e.error === 'not-allowed') {
                        showToast("Microphone permission denied. Please allow mic access in your browser.", "error");
                        isRecordingRef.current = false;
                        setIsRecording(false);
                    }
                };

                rec.onend = () => {
                    if (isRecordingRef.current) {
                        try { rec.start(); } catch (err) {
                            isRecordingRef.current = false;
                            setIsRecording(false);
                        }
                    } else {
                        setIsRecording(false);
                    }
                };

                return rec;
            };

            const toggleSpeech = async () => {
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                    showToast("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.", "error");
                    return;
                }

                if (isRecording) {
                    isRecordingRef.current = false;
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch(e) {}
                    }
                    setIsRecording(false);
                    showToast("Voice recording paused.", "success");
                    return;
                }

                try {
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(t => t.stop());
                    }
                } catch (err) {
                    showToast("Microphone access denied. Please enable mic access in your browser address bar.", "error");
                    return;
                }

                baseAnswerRef.current = currentAnswer;
                if (!recognitionRef.current) {
                    recognitionRef.current = initRecognition();
                }

                try {
                    isRecordingRef.current = true;
                    recognitionRef.current.start();
                    setIsRecording(true);
                    showToast("Microphone active! Speak now...", "success");
                } catch (err) {
                    try {
                        recognitionRef.current = initRecognition();
                        isRecordingRef.current = true;
                        recognitionRef.current.start();
                        setIsRecording(true);
                        showToast("Microphone active! Speak now.", "success");
                    } catch (e2) {
                        showToast("Could not activate microphone: " + e2.message, "error");
                        isRecordingRef.current = false;
                        setIsRecording(false);
                    }
                }
            };

            const handleStart = async () => {
                if (!topic.trim()) {
                    showToast("Please enter or select a topic to practice.", "error");
                    return;
                }
                setLoading(true);
                try {
                    const response = await api.post("/interviews/practice/configure", {
                        topic: topic.trim(),
                        difficulty,
                        num_questions: numQuestions
                    });
                    
                    const qList = response.data.questions || [];
                    setPracticeId(response.data.id);
                    setQuestions(qList);
                    setCurrentIndex(0);
                    setAnswersData({});
                    setCurrentAnswer("");
                    baseAnswerRef.current = "";
                    setStep("active");
                } catch (err) {
                    showToast("Could not generate practice questions: " + (err.response?.data?.detail || err.message), "error");
                } finally {
                    setLoading(false);
                }
            };

            const switchQuestion = (idx) => {
                if (isRecording && recognitionRef.current) {
                    isRecordingRef.current = false;
                    try { recognitionRef.current.stop(); } catch(e) {}
                    setIsRecording(false);
                }
                setCurrentIndex(idx);
                const existing = answersData[idx];
                const text = existing ? existing.answerText : "";
                setCurrentAnswer(text);
                baseAnswerRef.current = text;
            };

            const handleSubmitCurrentAnswer = async () => {
                if (!currentAnswer.trim()) {
                    showToast("Please provide an answer before submitting.", "error");
                    return;
                }
                if (isRecording && recognitionRef.current) {
                    isRecordingRef.current = false;
                    try { recognitionRef.current.stop(); } catch(e) {}
                    setIsRecording(false);
                }

                setEvaluating(true);
                try {
                    const response = await api.post("/interviews/practice/submit", {
                        practice_id: practiceId,
                        question_index: currentIndex,
                        user_answer: currentAnswer.trim()
                    });

                    const evalResult = response.data.evaluation;
                    setAnswersData(prev => ({
                        ...prev,
                        [currentIndex]: {
                            answerText: currentAnswer.trim(),
                            evaluation: evalResult
                        }
                    }));
                    showToast("Answer evaluated with rigorous technical scoring!", "success");
                } catch (err) {
                    showToast("Grading submit failed: " + (err.response?.data?.detail || err.message), "error");
                } finally {
                    setEvaluating(false);
                }
            };

            const currentQ = questions[currentIndex] || {};
            const currentEval = answersData[currentIndex]?.evaluation;

            if (loading) {
                return (
                    <div className="spinner-container">
                        <div className="spinner"></div>
                        <p style={{ color: 'var(--text-muted)' }}>AI engine analyzing topic & generating {numQuestions} tailored practice drill questions...</p>
                    </div>
                );
            }

            if (step === "setup") {
                const popularTopics = [
                    "SQL Indexing & Normalization",
                    "REST API Security & JWT",
                    "FastAPI Middleware Lifecycle",
                    "React State & Re-rendering",
                    "System Architecture & Scaling",
                    "Docker & Microservices",
                    "Data Structures: Trees & HashMaps",
                    "Python Memory & GIL Internals"
                ];

                return (
                    <div style={{ maxWidth: '680px', margin: '0 auto' }}>
                        <h2 className="header-title" style={{ marginBottom: '1.5rem' }}>
                            <i className="fa-solid fa-dumbbell text-success"></i> Focused Practice Drills
                        </h2>
                        
                        <div className="glass-panel" style={{ display: 'flex', flexDirection: 'column', gap: '1.4rem' }}>
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label style={{ fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <i className="fa-solid fa-bullseye text-primary"></i> Target Topic or Skill
                                </label>
                                <input 
                                    type="text" 
                                    className="form-input" 
                                    value={topic} 
                                    onChange={e => setTopic(e.target.value)} 
                                    placeholder="e.g. Database Indexing, React Hooks, Kafka, or System Design"
                                />
                                <div style={{ marginTop: '0.6rem' }}>
                                    <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', display: 'block', marginBottom: '0.4rem' }}>
                                        Popular practice topics:
                                    </span>
                                    <div className="choice-chips">
                                        {popularTopics.map(t => (
                                            <span 
                                                key={t}
                                                className={`choice-chip ${topic === t ? 'active' : ''}`}
                                                style={{ fontSize: '0.8rem', padding: '0.35rem 0.75rem' }}
                                                onClick={() => setTopic(t)}
                                            >
                                                {t}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label style={{ fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <i className="fa-solid fa-list-ol text-primary"></i> Number of Questions to Practice
                                </label>
                                <div className="choice-chips">
                                    {[
                                        { val: 3, label: "3 Questions", desc: "Quick Drill" },
                                        { val: 5, label: "5 Questions", desc: "Standard Practice" },
                                        { val: 10, label: "10 Questions", desc: "Deep Dive Drill" }
                                    ].map(opt => (
                                        <div
                                            key={opt.val}
                                            className={`choice-chip ${numQuestions === opt.val ? 'active' : ''}`}
                                            onClick={() => setNumQuestions(opt.val)}
                                            style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', padding: '0.55rem 0.95rem' }}
                                        >
                                            <span style={{ fontWeight: 600 }}>{opt.label}</span>
                                            <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>{opt.desc}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="input-group" style={{ marginBottom: 0 }}>
                                <label style={{ fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <i className="fa-solid fa-layer-group text-primary"></i> Difficulty Level
                                </label>
                                <div className="choice-chips">
                                    {[
                                        { id: "Easy", label: "Easy", color: "#10B981", icon: "fa-seedling" },
                                        { id: "Medium", label: "Medium", color: "#F59E0B", icon: "fa-bolt" },
                                        { id: "Hard", label: "Hard", color: "#EF4444", icon: "fa-fire" }
                                    ].map(opt => (
                                        <div
                                            key={opt.id}
                                            className={`choice-chip ${difficulty === opt.id ? 'active' : ''}`}
                                            onClick={() => setDifficulty(opt.id)}
                                            style={difficulty === opt.id ? { borderColor: opt.color, boxShadow: `0 0 10px ${opt.color}35` } : {}}
                                        >
                                            <i className={`fa-solid ${opt.icon}`} style={{ color: opt.color }}></i>
                                            <span>{opt.label}</span>
                                            {difficulty === opt.id && <i className="fa-solid fa-check" style={{ fontSize: '0.75rem' }}></i>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <button className="btn btn-primary" style={{ width: '100%', padding: '0.9rem', marginTop: '0.5rem', fontSize: '1rem' }} onClick={handleStart}>
                                <i className="fa-solid fa-bolt"></i> Generate Practice Questions ({numQuestions} Questions)
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === "active") {
                const totalQuestions = questions.length;
                const answeredCount = Object.keys(answersData).length;
                const isAllAnswered = answeredCount === totalQuestions && totalQuestions > 0;

                return (
                    <div style={{ maxWidth: '850px', margin: '0 auto' }}>
                        <div className="flex-between" style={{ alignItems: 'flex-start', marginBottom: '1rem' }}>

                                <h2 className="header-title" style={{ marginBottom: '0.35rem' }}>
                                    Practice Drill: {topic}

                                <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                                    <span className={`badge ${difficulty === 'Easy' ? 'badge-success' : difficulty === 'Medium' ? 'badge-warning' : 'badge-danger'}`}>
                                        {difficulty}

                                    <span className="badge" style={{ background: 'rgba(99, 102, 241, 0.15)', color: '#818CF8' }}>
                                        Question {currentIndex + 1} of {totalQuestions}
                                    </span>
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '0.5rem' }}>
                                {isAllAnswered && (
                                    <button className="btn btn-primary" onClick={() => setStep("summary")}>
                                        <i className="fa-solid fa-flag-checkered"></i> View Drill Summary
                                    </button>
